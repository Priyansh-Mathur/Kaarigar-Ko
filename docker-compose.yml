services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: kaarigarko-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kaarigarko
      POSTGRES_PASSWORD: kaarigarko
      POSTGRES_DB: kaarigarko
    ports:
      - "5432:5432"
    volumes:
      - kaarigarko_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaarigarko -d kaarigarko"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kaarigarko-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - kaarigarko_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kaarigarko_pgdata:
  kaarigarko_redisdata:
